name: OpenUpdater Windows Package

on:
  push:
    branches: [main]
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish (for example 2.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Resolve package version
        shell: pwsh
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $project = Get-Content "CMakeLists.txt" -Raw
          if ($project -notmatch 'project\(OpenUpdater VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "Unable to determine OpenUpdater project version."
          }

          $version = $Matches[1]
          "OPENUPDATER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG_INPUT)) {
            $releaseTag = $env:RELEASE_TAG_INPUT
          }
          else {
            $releaseTag = ""
          }

          "OPENUPDATER_RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append

          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            $tagVersion = $releaseTag -replace '^v', ''
            if ($tagVersion -ne $version) {
              throw "Release tag $releaseTag does not match project version $version."
            }
          }

      - name: Install OpenSSL, NSIS and ImageMagick
        shell: pwsh
        run: |
          choco install openssl.light nsis imagemagick.app -y --no-progress

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          magick assets/openupdater.svg -background none -define icon:auto-resize=256,128,64,48,32,16 assets/openupdater.ico
          if (-not (Test-Path "assets/openupdater.ico")) {
            throw "Application icon was not generated."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="C:/Program Files/OpenSSL" -DOPENUPDATER_BUILD_GUI=ON -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $gui = "build\Release\openupdater.exe"
          if (-not (Test-Path $gui)) {
            throw "GUI executable was not built: $gui"
          }

          windeployqt --release --no-translations --no-system-d3d-compiler $gui

      - name: Package
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -G NSIS
          cpack --config build/CPackConfig.cmake -G ZIP

      - name: Verify packages
        shell: pwsh
        run: |
          $installer = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.exe"
          $portable = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.zip"

          if (-not (Test-Path $installer)) {
            throw "Installer was not generated: $installer"
          }
          if (-not (Test-Path $portable)) {
            throw "Portable ZIP was not generated: $portable"
          }

          $entries = tar -tf $portable
          foreach ($required in @(
            "openupdater.exe",
            "openupdater-cli.exe",
            "libcrypto-3-x64.dll",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "Qt6Svg.dll",
            "platforms/qwindows.dll"
          )) {
            if (-not ($entries -match [regex]::Escape($required))) {
              throw "Portable package does not contain required file: $required"
            }
          }

      - name: Test installer
        shell: pwsh
        run: |
          $installer = ".\OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "OpenUpdaterInstalled"

          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)."
          }

          foreach ($required in @(
            "openupdater.exe",
            "openupdater-cli.exe",
            "libcrypto-3-x64.dll",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll",
            "platforms\qwindows.dll"
          )) {
            $path = Join-Path $installDir $required
            if (-not (Test-Path $path)) {
              throw "Installer did not install required file: $required"
            }
          }

          & (Join-Path $installDir "openupdater-cli.exe") version $env:OPENUPDATER_VERSION | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Installed CLI failed to start."
          }

          $guiProcess = Start-Process -FilePath (Join-Path $installDir "openupdater.exe") -PassThru
          Start-Sleep -Seconds 3
          if ($guiProcess.HasExited) {
            throw "Installed GUI exited immediately with code $($guiProcess.ExitCode)."
          }
          Stop-Process -Id $guiProcess.Id -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $installer = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.exe"
          $portable = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.zip"

          @(
            (Get-FileHash $installer -Algorithm SHA256)
            (Get-FileHash $portable -Algorithm SHA256)
          ) | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content "SHA256SUMS.txt"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenUpdater-Windows-x64
          path: |
            OpenUpdater-${{ env.OPENUPDATER_VERSION }}-windows-x64.exe
            OpenUpdater-${{ env.OPENUPDATER_VERSION }}-windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: env.OPENUPDATER_RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:OPENUPDATER_RELEASE_TAG
          $installer = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.exe"
          $portable = "OpenUpdater-$env:OPENUPDATER_VERSION-windows-x64.zip"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            gh release upload $tag $installer $portable SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          }
          else {
            gh release create $tag $installer $portable SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --latest
          }
